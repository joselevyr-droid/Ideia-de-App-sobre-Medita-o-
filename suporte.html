<!DOCTYPE html>

</head>
<body>

    Prefere falar direto?<br>
    <a href="https://mail.google.com/mail/?view=cm&to=levyrjose@gmail.com">
  levyrjose@gmail.com
</a>
  </p>
</div>
<div id="popup" class="popup">
  <p>Mensagem enviada com sucesso ✅</p>
</div>
<script src="suport01.js"></script>
<audio id="musicaGlobal" loop></audio>
<script src="suport02.js"></script>

</html>
