<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perf.css">
</head>
<body>
<button id="btnVoltar" class="btn-voltar">‹</button>
<div class="perfil-popup">
  <div class="topo-perfil">
    <div class="foto-container">
  <img id="fotoPerfil2" src="" alt="Foto de perfil">
  <button id="btnFoto" class="btn-foto">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 24 24">
      <path d="M12 5c-3.86 0-7 3.14-7 7s3.14 7 7 7 
               7-3.14 7-7-3.14-7-7-7zm0 12c-2.76 0-5-2.24-5-5
               s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm6-12l-1.5-2h-5
               L10 5H5v14h14V5h-1z"/>
    </svg>
  </button>
  <input type="file" id="inputFoto" accept="image/*" hidden>
</div>
    <div class="info-usuario">
      <div class="nome-container">
        <h2 id="nomeUsuario"></h2>
        <svg id="editarNome" xmlns="http://www.w3.org/2000/svg" 
             width="18" height="18" viewBox="0 0 24 24" fill="gray">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm14.71-9.04a1.003 1.003 0 0 0 0-1.42l-2.5-2.5a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.99-1.66z"/>
        </svg>
      </div>
      <p id="emailUsuario"></p>
    </div>
  </div>
  <button class="logout-btn" id="btnLogout">Desconect</button>
</div>
<div id="popupNome" class="popup-nome">
  <div class="popup-box">
    <h3>Editar nome</h3>
    <input type="text" id="inputNome">
    <button id="salvarNome">Salvar</button>
  </div>
</div>
  <script src="perf01.js"></script>
<audio id="musicaGlobal" loop></audio>
  <script src="perf02.js"></script>
  <script src="perf03.js"></script>
  <script src="perf04.js"></script>
  <script src="perf05.js"></script>
</body>
</html>
