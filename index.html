<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Home</title>

  <!-- Fonte bonitinha -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
  
  .linhas-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

/* estilo base */
.linhas-bg path {
  fill: none;
  stroke: var(--cor-linhas);
  stroke-width: 10;

  opacity: 0.6;

  /* animação de desenho */
  stroke-dasharray: 1200;
  stroke-dashoffset: 1200;

  animation: desenhar 2.5s ease forwards;

  /* glow leve */
  filter: drop-shadow(0 0 6px var(--cor-linhas));
}

  .videos-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  padding: 20px;
}
  
/* variações pra profundidade */
.linhas-bg path:nth-child(2) {
  stroke: var(--cor-linhas-sec);
  opacity: 0.4;
  animation-delay: 0.2s;
}

.linhas-bg path:nth-child(3) {
  opacity: 0.3;
  animation-delay: 0.4s;
}

.linhas-bg path:nth-child(4) {
  opacity: 0.2;
  animation-delay: 0.6s;
}
  
  @keyframes desenhar {
  to {
    stroke-dashoffset: 0;
  }
}
  
.player-content {
  width: 100%;
  max-width: 900px;
}

/* container do vídeo */
.video-wrapper {
  width: 100%;
  aspect-ratio: 16/9;

  margin-top: 40px;   /* espaço do topo */
  border-radius: 15px;
  overflow: hidden;
}

/* iframe ocupa tudo */
.video-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* espaço embaixo (pra não ficar colado) */
.video-info-popup {
  margin-top: 30px;
}
  
  .perfil {
  position: absolute;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%; /* deixa redonda */
  object-fit: cover;

  top: 50%;
  transform: translateY(-50%);
}
  
    /* ===== CONFIGURAÇÕES GLOBAIS ===== */
    :root {
      --cor-fundo: #f5f5f5;
      --cor-barra: #e6e6e6;
      --cor-texto: #777;
      --borda-arredondada: 30px;
      --largura-barra: 500px;
      --cor-popup: #ffffff;
      --cor-fundo: #ffffff;      /* cor base */
      --cor-linhas: #7fbfa3;     /* verde mais claro */
      --cor-linhas-sec: #4e7a68; /* verde mais escuro */
      --bg-site: #ffffff; /* cor atual do fundo */
    }

    /* ===== RESET BÁSICO ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--cor-fundo);
    }

    /* ===== TOPO ===== */
    .topo {
      width: 100%;
      display: flex;
      justify-content: center; /* centraliza horizontal */
      padding: 20px 0;
      position: relative;
    }
  
    /* ===== BARRA DE PESQUISA ===== */
    .barra-pesquisa {
      width: 100%;
      max-width: var(--largura-barra);
      margin: 0 auto;
      background-color: var(--cor-barra);
      border-radius: var(--borda-arredondada);
      padding: 10px 20px;
      margin-left: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 70px;
    }

    .barra-pesquisa input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 16px;
      color: var(--cor-texto);
    }

    .icone {
      font-size: 18px;
      color: var(--cor-texto);
    }
  .menu-btn {
  position: absolute;
  left: 20px;
  font-size: 30px;
  cursor: pointer;
  user-select: none;
  top: 50%;
  transform: translateY(-50%) scaleX(1.3);
}

.popup {
  position: absolute;
  top: 60px;
  left: 20px;
  background-color: var(--cor-popup);
  border-radius: 15px;
  padding: 10px 0;
  width: 180px;

  display: flex;
  flex-direction: column;

  box-shadow: 0 5px 15px rgba(0,0,0,0.1);

  /* NOVO */
  opacity: 0;
  transform: scale(0.5) translateY(-20px);
  pointer-events: none;

  transition: 0.25s ease;
}

  .popup.ativo {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}
  
.popup a {
  padding: 10px 15px;
  text-decoration: none;
  color: var(--cor-texto);
  transition: 0.2s;
}

.popup a:hover {
  background-color: #f0f0f0;
}
  
.barra-pesquisa.ativa .icon-lupa {
  width: 0;
  opacity: 0;
  overflow: hidden;
}

.barra-pesquisa input {
  padding-left: 10px;
  transition: 0.2s;
}

.barra-pesquisa.ativa input {
  padding-left: 0;
}
  
  .video-card {
  position: relative;
  width: 300px; /* pode ajustar depois */
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(30px) scale(0.95);
}
  
.video-card.mostrar {
  animation: aparecerVideo 0.8s ease forwards;
}
  
@keyframes aparecerVideo {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
  
  .thumb {
  width: 100%;
  display: block;
}
  
.overlay {
  position: absolute;
  inset: 0; /* ocupa toda a thumb */
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 15px;
}
  
.gradiente {
  position: absolute;
  inset: 0;

  background: linear-gradient(
    to top,
    rgba(0,0,0,0.9),
    rgba(0,0,0,0.5),
    rgba(0,0,0,0)
  );

  z-index: 1;
}
  
  .titulo {
  font-size: 16px;
  margin-bottom: 5px;

  /* limita a 2 linhas */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  position: relative;
  z-index: 2;
  color: white;
}

.info {
  font-size: 13px;
  opacity: 0.8;
  position: relative;
  z-index: 2;
  color: white;
}
  
 .video-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(80, 150, 120, 0.3); /* verde suave */
  pointer-events: none;
}
  
  .video-player {
  position: fixed;
  inset: 0;
  background: var(--bg-site);

  display: flex;
  justify-content: center;
  align-items: center;

  transform: translateY(100%);
  opacity: 0;

  transition: transform 0.4s ease, opacity 0.4s ease;

  z-index: 999;

  touch-action: none;
}

.video-player.active {
  transform: translateY(0);
  opacity: 1;
}

/* área de arraste no topo */
.drag-area {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 80px;
  z-index: 1000;
}

/* barrinha visual*/
.icon-lupa {
  width: 18px;
  height: 18px;
  transition: opacity 0.2s ease;
}
  
.icon-lupa circle,
.icon-lupa line {
  stroke: #888; /* cinza */
}
  
  </style>
</head>

<body>
<svg class="linhas-bg" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <path d="M0,200 Q300,50 600,200 T1200,200" />
  <path d="M0,350 Q400,150 800,350 T1200,350" />
  <path d="M0,500 Q300,300 700,500 T1200,500" />
  <path d="M0,650 Q500,450 900,650 T1200,650" />
</svg>
  <div class="topo">
    <img src="https://raw.githubusercontent.com/joselevyr-droid/Ideia-de-App-sobre-Medita-o-/refs/heads/Graphics/28%20Sem%20T%C3%ADtulo_20260321172415.png" class="perfil">
    <div class="menu-btn" id="menuBtn">☰</div>
    <div class="popup" id="popupMenu">
  <a href="#">Início</a>
  <a href="#">Perfil</a>
  <a href="#">Configurações</a>
  <a href="#">Sair</a>
</div>
    <div class="barra-pesquisa">
      <span class="icon-lupa">
      <svg viewBox="0 0 24 24" class="icon-lupa">
      <circle cx="11" cy="11" r="7" stroke="gray" stroke-width="2" fill="none"/>
      <line x1="16" y1="16" x2="21" y2="21" stroke="gray" stroke-width="2"/>
      </svg>
      </span>
      <input type="text" placeholder="Pesquisar">
    </div>
  </div>
  
  <div class="videos-container">
  <!-- vídeos vão aqui dentro -->
    <div class="video-card" data-video="https://youtu.be/dkg1N8-cFV8?si=8dlHtrIWn7ALDyQV">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqyhsmgPWp1i-Nx_Sjq-sjf4BQ9SQed-u2BN_iy_I_gA&s=10" class="thumb">

  <div class="overlay">
    <div class="gradiente"></div>
    
    <h3 class="titulo">Meditação Guiada para RELAXAMENTO PROFUNDO</h3>
    <p class="info">Raissa Zoccal • 878 mil views</p>
  </div>
</div>
    
    
</div>
  
  <div class="video-player" id="videoPlayer">

  <div class="drag-area"></div>

  <div class="player-content">
  <div class="video-wrapper">
  <iframe id="ytPlayer"
  width="560"
  height="315"
  src="https://www.youtube.com/embed/ysz5S6PUM-U"
  allow="autoplay; encrypted-media"
  allowfullscreen>
</iframe>
  </div>

  <div class="video-info-popup">
    <!-- título, canal, etc -->
  </div>
</div>

</div>
  
<script>
  const menuBtn = document.getElementById("menuBtn");
  const popup = document.getElementById("popupMenu");

  let aberto = false;

  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    aberto = !aberto;
    popup.classList.toggle("ativo");
  });

  document.addEventListener("click", () => {
    popup.classList.remove("ativo");
    aberto = false;
  });

  popup.addEventListener("click", (e) => {
    e.stopPropagation();
  });
</script>
  
<script>
  const barra = document.querySelector(".barra-pesquisa");
  const input = barra.querySelector("input");

  input.addEventListener("focus", () => {
    barra.classList.add("ativa");
  });

  input.addEventListener("blur", () => {
    if (input.value === "") {
      barra.classList.remove("ativa");
    }
  });
</script>
  
<script>
  const player = document.getElementById("videoPlayer");
  const cards = document.querySelectorAll(".video-card");
  const iframe = document.getElementById("ytPlayer");

  let startY = 0;
  let currentY = 0;
  let isDragging = false;

  cards.forEach(card => {
  card.addEventListener("click", () => {
    let videoURL = card.getAttribute("data-video");

    // extrai o ID do vídeo
    let videoID = videoURL.split("youtu.be/")[1].split("?")[0];

    // URL correta com autoplay + mute
    let embedURL = `https://www.youtube.com/embed/${videoID}?autoplay=1&mute=1`;

    iframe.src = embedURL;
    player.classList.add("active");
  });
});

  // fechar e parar vídeo
  function fecharPlayer() {
    player.classList.remove("active");

    setTimeout(() => {
      iframe.src = ""; // para o vídeo
      player.style.transform = "";
    }, 400);
  }

  // DRAG (mantive tua lógica)
  player.addEventListener("touchstart", (e) => {
    if (!e.target.classList.contains("drag-area")) return;

    isDragging = true;
    startY = e.touches[0].clientY;
  });

  player.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    currentY = e.touches[0].clientY;
    let diff = currentY - startY;

    if (diff > 0) {
      player.style.transform = `translateY(${diff}px)`;
    }
  });

  player.addEventListener("touchend", () => {
    if (!isDragging) return;

    isDragging = false;

    let diff = currentY - startY;

    if (diff > 150) {
      fecharPlayer();
    } else {
      player.style.transform = "";
    }
  });
</script>
  
<script>
  const videos = document.querySelectorAll(".video-card");

  window.addEventListener("load", () => {
    videos.forEach((video, i) => {
      setTimeout(() => {
        video.classList.add("mostrar");
      }, 600 + i * 150); // atraso inicial + efeito em cascata
    });
  });
</script>
  
</body>
</html>
