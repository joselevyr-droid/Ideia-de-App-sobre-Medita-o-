<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

/* fundo da página com degradê */
body.login-page {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: linear-gradient(to bottom, #4e7a68, #7fbfa3); /* degradê verde topo -> base */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* pop-up branco com borda degradê */
.login-popup {
  position: fixed;
  top: 20px;          /* distância do topo */
  bottom: 20px;       /* distância de baixo */
  left: 20px;         /* distância da esquerda */
  right: 20px;        /* distância da direita */
  padding: 5px;       /* espaço da borda degradê */
  background: linear-gradient(to bottom, #4e7a68, #7fbfa3); /* borda com degradê */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  box-sizing: border-box;
}

.login-popup-inner {
  background: #ffffff;       /* fundo branco */
  border-radius: 20px;       /* cantos arredondados */
  width: 90%;                /* ocupa quase toda a largura */
  max-width: 600px;          /* limita no desktop */
  padding: 30px 20px;        /* espaço interno */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;                 /* espaço entre elementos */
  box-sizing: border-box;
}

/* inputs e botões dentro do pop-up */
.login-popup-inner input {
  width: 100%;
  padding: 12px 15px;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
  box-sizing: border-box;
}

.login-popup button {
  width: 100%;
  padding: 12px 0;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  background: linear-gradient(135deg, #4e7a68, #7fbfa3); /* degradê verde */
  transition: 0.3s;
}

.login-popup button:hover {
  filter: brightness(1.1);
}

  .mensagem {
    color: red;
    text-align: center;
    margin-bottom: 12px;
    font-size: 14px;
  }
  
  .login-popup-inner a {
  color: #4e7a68;
  text-decoration: none;
}

.login-popup-inner a:first-of-type {
  margin-top: 10px;
  font-size: 14px;
}

.login-popup-inner a:last-of-type {
  margin-top: 20px;
  font-size: 12px;
}
</style>
</head>
<body class="login-page">
  <div class="login-popup">
<div class="login-popup-inner">
  <input type="email" placeholder="Email" id="emailLogin">
  <p id="erroEmail" class="mensagem"></p>
  
  <input type="password" placeholder="Senha" id="senhaLogin">
  <p id="erroSenha" class="mensagem"></p>
  
  <button id="btnLogin">Entrar</button>

  <!-- Link de esqueci minha senha -->
  <a href="recuperation.html" style="margin-top:10px; font-size:14px; text-decoration:none; color:#4e7a68;">Esqueci minha senha</a>

  <!-- Link de ajuda/contato no final -->
  <a href="suporte.html" style="margin-top:20px; font-size:12px; text-decoration:none; color:#4e7a68;">Ajuda | Contato</a>
</div>
</div>
  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

// 🔥 SUA CONFIG REAL
const firebaseConfig = {
  apiKey: "AIzaSyD2mjS23WRt0kBSDrHVpnzfv-L2o4hnJAQ",
  authDomain: "meditation-10d05.firebaseapp.com",
  projectId: "meditation-10d05",
  storageBucket: "meditation-10d05.firebasestorage.app",
  messagingSenderId: "890566489853",
  appId: "1:890566489853:web:4ddecfe7007d5818363094"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ELEMENTOS
const inputEmail = document.getElementById("emailLogin");
const inputSenha = document.getElementById("senhaLogin");
const btnLogin = document.getElementById("btnLogin");
const erroEmail = document.getElementById("erroEmail");
const erroSenha = document.getElementById("erroSenha");

btnLogin.addEventListener("click", async (e) => {
  e.preventDefault();

  erroEmail.style.display = "none";
  erroSenha.style.display = "none";

const email = inputEmail.value.replace(/\s+/g, "").toLowerCase();
const senha = inputSenha.value.replace(/\s+/g, "");
  

  // VALIDAÇÕES
  if (!email.endsWith("@gmail.com")) {
    erroEmail.textContent = "O email precisa terminar com @gmail.com";
    erroEmail.style.display = "block";
    return;
  }

  if (senha.length < 6) {
  erroSenha.textContent = "A senha deve ter no mínimo 6 caracteres";
  erroSenha.style.display = "block";
  return;
}

  try {
    // 🔹 TENTA LOGAR
    const userCredential = await signInWithEmailAndPassword(auth, email, senha);
    const user = userCredential.user;

 if (!user.emailVerified) {
  const reenviar = confirm("Verifique seu email antes de entrar! Quer reenviar o link de verificação?");
  if (reenviar) await sendEmailVerification(user);
  return;
}

    // login OK
    localStorage.setItem("usuarioLogado", email);
    window.location.href = "index.html";

  } catch (error) {

    // 🔹 SE NÃO EXISTE → CRIA CONTA
    if (error.code === "auth/user-not-found") {
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        await sendEmailVerification(user);

        alert("Conta criada! Verifique seu email antes de entrar.");
      } catch (err) {
        alert(err.message);
      }
    } else {
      alert("Erro: " + error.message);
    }
  }
});
</script>
  
  <audio id="musicaGlobal" loop></audio>
  <script>
const audioGlobal = document.getElementById("musicaGlobal");

// pega configurações salvas
let musicaSalva = localStorage.getItem("musicaGlobal") || "https://gregarious-lollipop-5e2115.netlify.app/Hi.mp3";
let volumeSalvo = localStorage.getItem("volumeGlobal");
if (volumeSalvo === null) volumeSalvo = 0.5;

audioGlobal.src = musicaSalva;
audioGlobal.volume = parseFloat(volumeSalvo);

// flag para ativar áudio só depois de interação
let audioAtivado = false;

function ativarAudioGlobal() {
    if (!audioAtivado) {
        audioAtivado = true;
        audioGlobal.play().catch(e => console.log("Erro ao tocar música:", e.message));
    }
}

// ativar no primeiro clique ou touch
document.addEventListener("click", ativarAudioGlobal, { once: true });
document.addEventListener("touchstart", ativarAudioGlobal, { once: true });
</script>
</body>
</html>
