<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Curso</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background-size: cover;
  color: white;
}

/* TOPO */
.topo {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}

.titulo-topo {
  font-size: 20px;
  font-weight: 600;
}

.menu-btn {
  position: absolute;
  left: 20px;
  font-size: 28px;
  cursor: pointer;
}

.perfil {
  position: absolute;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

/* MENU */
.popup {
  position: absolute;
  top: 60px;
  left: 20px;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  display: none;
  z-index: 10;
}

.popup a {
  display: block;
  padding: 12px;
  text-decoration: none;
  color: #333;
}

.popup a:hover {
  background: #eee;
}

/* GRID (2 colunas mobile, mais elegante) */
.videos-container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 15px;
}

/* CARD */
.video-card {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid rgba(255,255,255,0.15);
}

.video-card:hover {
  transform: translateY(-3px);
}

/* THUMB (parte importante) */
.thumb {
  width: 100%;
  aspect-ratio: 16/9;
  overflow: hidden;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* TEXTO */
.video-info {
  padding: 8px;
}

.video-info h3 {
  font-size: 13px;
  margin-bottom: 3px;
}

.video-info p {
  font-size: 11px;
  opacity: 0.8;
}

/* PLAYER */
.video-player {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: 20px;
  z-index: 20;

  background: var(--bg-player);
  backdrop-filter: blur(10px);
}

.video-player.active {
  display: flex;
}

.video-wrapper {
  width: 100%;
  aspect-ratio: 16/9;
}

.video-wrapper iframe {
  width: 100%;
  height: 100%;
}

.btn-fechar {
  margin-bottom: 10px;
  font-size: 22px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="topo">
  <div class="menu-btn" id="menuBtn">☰</div>
  <div class="titulo-topo">Curso Meditação</div>
  <img id="fotoUsuario" class="perfil">
</div>

<div class="popup" id="popupMenu">
  <a href="index.html">Tela Inicial</a>
  <a href="configuration.html">Configurações</a>
</div>

<div class="videos-container">

  <div class="video-card" data-video="https://youtu.be/RBVtBydw2dI?si=J-Q_U9cS_n5TVSW9">
    <div class="thumb">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcLGG-6BM-Q7wX_5RmhvXw6uwp_GsAiWPcZBzRLTFTBA&s=10">
    </div>
    <div class="video-info">
      <h3>Abertura</h3>
      <p>Jonas Masetti</p>
    </div>
  </div>

  <div class="video-card" data-video="https://youtu.be/k44qcgoKkUc?si=-1A429BIm7ctQVlZ">
    <div class="thumb">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFvYZSfJJ6zXBmcvMHpv6XcjumxHWIq-a7Z5LuCM5qLED-DsPmG6P3JxXX&s=10">
    </div>
    <div class="video-info">
      <h3>Introdução</h3>
      <p>Masetti</p>
    </div>
  </div>

</div>

<!-- PLAYER -->
<div class="video-player" id="player">
  <div class="btn-fechar" id="fechar">✕</div>

  <div class="video-wrapper">
    <iframe id="iframe" allow="autoplay"></iframe>
  </div>
</div>

<script>
/* MENU */
const menuBtn = document.getElementById("menuBtn");
const popup = document.getElementById("popupMenu");

menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  popup.style.display = popup.style.display === "block" ? "none" : "block";
});

popup.addEventListener("click", (e) => e.stopPropagation());

document.addEventListener("click", () => {
  popup.style.display = "none";
});

/* PLAYER */
const cards = document.querySelectorAll(".video-card");
const player = document.getElementById("player");
const iframe = document.getElementById("iframe");

cards.forEach(card => {
  card.onclick = () => {
    const id = card.dataset.video;
    iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    player.classList.add("active");
  };
});

document.getElementById("fechar").onclick = () => {
  player.classList.remove("active");
  iframe.src = "";
};

/* FOTO PERFIL */
const foto = document.getElementById("fotoUsuario");
const fotoSalva = localStorage.getItem("fotoPerfil");

if (fotoSalva) {
  foto.src = fotoSalva;
}

foto.onclick = () => {
  window.location.href = "perfil.html";
};

/* TEMA */
const degrades = [
  "linear-gradient(to bottom, #4e7a68, #7fbfa3)",
  "linear-gradient(to bottom, #b85c5c, #e09a9a)",
  "linear-gradient(to bottom, #5c7eb8, #9ab9e0)",
  "linear-gradient(to bottom, #7a5ca0, #b49ad6)",
  "linear-gradient(to bottom, #d68b5c, #f2b89a)",
  "linear-gradient(to bottom, #333333, #666666)"
];

let temaAtual = parseInt(localStorage.getItem("temaAtual"));
if (isNaN(temaAtual)) temaAtual = 0;

// fundo normal
document.body.style.background = degrades[temaAtual];

// fundo do player (com escurecimento leve)
const overlayEscuro = "linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6))";
document.documentElement.style.setProperty(
  "--bg-player",
  `${overlayEscuro}, ${degrades[temaAtual]}`
);
</script>
 <script>
// salva a página atual como anterior SEMPRE que entrar nela
document.addEventListener("DOMContentLoaded", () => {
  localStorage.setItem("paginaAnterior", window.location.href);
});
</script>
</body>
</html>
